name: create-release
'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_build:
    permissions:
      contents: write

    env:
      NWNSERVER_VERSION: "8193.37-15"
      NWN_ROOT: ${{ github.workspace }}/nwn
      NWN_HOME: ${{ github.workspace }}/nwn

    runs-on: ubuntu-latest
    name: 'NWN:EE CI Build'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # nasher/nwnsc brauchen zum Kompilieren der Skripte einen Teil der
      # offiziellen NWN-Serverdaten (nwscript.nss, Standard-Includes etc.).
      # Gleiche offizielle Quelle, die auch das nasher4gh-Docker-Image nutzt:
      # https://github.com/Ardesco/nasher4gh-images/blob/main/Dockerfile
      - name: Cache NWN server data
        id: cache-nwn
        uses: actions/cache@v4
        with:
          path: ${{ env.NWN_ROOT }}
          key: nwn-server-${{ env.NWNSERVER_VERSION }}

      - name: Download NWN server data
        if: steps.cache-nwn.outputs.cache-hit != 'true'
        run: |
          wget -q "https://nwn.beamdog.net/downloads/nwnee-dedicated-${NWNSERVER_VERSION}.zip"
          mkdir -p "$NWN_ROOT"
          unzip -q "nwnee-dedicated-${NWNSERVER_VERSION}.zip" -d "$NWN_ROOT"
          rm "nwnee-dedicated-${NWNSERVER_VERSION}.zip"

      # nasher nutzt seit Version 1.0.0 standardmaessig neverwinter.nim's
      # nwn_script_comp als Compiler statt des aelteren, separaten nwnsc -
      # genau der Compiler, den du hier haben willst, da er mit EE aktiv
      # weiterentwickelt wird. Wir holen ihn als fertiges Release-Binary,
      # dieselbe Quelle wie bei den nwsync-Tools weiter unten.
      - name: Install nwn_script_comp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir scriptcomp_tools
          gh release download -R niv/neverwinter.nim --pattern "*linux*" -D scriptcomp_tools
          cd scriptcomp_tools
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f"; done
          sudo mv nwn_script_comp /usr/local/bin/nwn_script_comp
          sudo chmod +x /usr/local/bin/nwn_script_comp

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Cache fuer ~/.nimble: nasher + neverwinter.nim werden aus dem
      # Quellcode kompiliert, das kostet beim allerersten Lauf ein paar
      # Minuten. Mit Cache-Treffer faellt das danach wieder weg.
      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-nasher

      - name: Install nasher
        run: nimble install nasher -y

      - name: Build module
        run: nasher pack --default

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Zip module
        id: zip
        run: |
          MODFILE=$(ls *.mod | head -n1)
          if [ -z "$MODFILE" ]; then
            echo "Kein .mod-File gefunden - Build fehlgeschlagen?"
            exit 1
          fi
          ZIPFILE="${MODFILE%.mod}.zip"
          zip -j "$ZIPFILE" "$MODFILE"
          echo "zipfile=$ZIPFILE" >> "$GITHUB_OUTPUT"
          echo "modfile=$MODFILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zipfile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NEU: das gebaute .mod als Artefakt weiterreichen, damit der
      # nwsync-Job es ohne erneuten Build weiterverwenden kann.
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: ${{ steps.zip.outputs.modfile }}

  # NEU: eigener Job, der aus dem gebauten Modul ein nwsync-Repository
  # erzeugt und auf GitHub Pages veröffentlicht.
  #
  # Bewusst als eigener, unabhängiger Job gehalten: falls ihr später auf
  # einen anderen Host wechselt (eigener Server, S3, ...), müsst ihr nur
  # den Schritt "Deploy to GitHub Pages" ersetzen (z.B. gegen rsync/scp
  # oder rclone) - der Build-Schritt mit nwn_nwsync_write bleibt gleich.
  nwsync_pages:
    needs: ci_build
    runs-on: ubuntu-latest
    name: 'NWSync Repo -> GitHub Pages'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built module
        uses: actions/download-artifact@v4
        with:
          name: module

      - name: Get nwsync tools (neverwinter.nim)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir nwsync_tools
          # Lädt das Linux-Release-Asset von niv/neverwinter.nim.
          # Falls das Muster nicht greift: im Actions-Log den Assetnamen
          # pruefen (https://github.com/niv/neverwinter.nim/releases) und
          # --pattern entsprechend anpassen.
          gh release download -R niv/neverwinter.nim --pattern "*linux*" -D nwsync_tools
          cd nwsync_tools
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f"; done
          chmod +x nwn_nwsync_write 2>/dev/null || true
          ls -la

      # UUID kommt aus der Repo-Variable MODULE_UUID (Settings -> Secrets and
      # variables -> Actions -> Variables). Muss ueber alle Builds hinweg
      # gleich bleiben, sonst gilt jede Version als komplett neues Modul
      # statt als Update. Einmalig generieren z.B. mit:
      # python3 -c "import uuid; print(uuid.uuid4())"
      - name: Build nwsync repository
        run: |
          MODFILE=$(ls *.mod | head -n1)
          mkdir -p nwsync_output
          # --with-module: das Modul selbst wird mit ausgeliefert, nicht nur
          # Haks/TLK. Laut Tool-Doku ausdruecklich NICHT fuer Persistent
          # Worlds gedacht, sondern fuer die volle Modul-Distribution -
          # genau unser Fall.
          ./nwsync_tools/nwn_nwsync_write \
            --with-module \
            --mod-uuid="${{ vars.MODULE_UUID }}" \
            nwsync_output/ "$MODFILE"
          # Verhindert, dass GitHub Pages die Ordnerstruktur (data/, manifests/)
          # durch Jekyll filtert/verändert.
          touch nwsync_output/.nojekyll

          # Statisches Platzhalterbild mit ausliefern (liegt fest im Repo,
          # kein generierter Build-Output).
          mkdir -p nwsync_output/assets
          cp assets/header_image.jpg nwsync_output/assets/header_image.jpg

      # repository.json (Build-Output in nwsync_output/) wird aus der im
      # Repo gepflegten Vorlage repository.json (Repo-Root) gefuellt - nur
      # die build-zeit-abhaengigen Werte (UUID aus der Repo-Variable,
      # Versions-Hash, Zeitstempel, Kontakt/Autor aus dem Repo-Besitzer)
      # kommen dazu.
      - name: Fill in repository.json with build data
        env:
          MODULE_UUID: ${{ vars.MODULE_UUID }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, time, pathlib

          repo = json.loads(pathlib.Path("repository.json").read_text())

          manifest_hash = pathlib.Path("nwsync_output/latest").read_text().strip()
          created_at = int(time.time())
          version_label = time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(created_at))

          repo["contact"] = f"https://github.com/{os.environ['REPO_OWNER']}"
          repo["modules"][0]["uuid"] = os.environ["MODULE_UUID"]
          repo["modules"][0]["author"] = os.environ["REPO_OWNER"]
          repo["modules"][0]["versions"] = [
              {
                  "identifier": manifest_hash,
                  "version": version_label,
                  "created_at": created_at,
              }
          ]

          pathlib.Path("nwsync_output/repository.json").write_text(
              json.dumps(repo, indent=2)
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nwsync_output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
